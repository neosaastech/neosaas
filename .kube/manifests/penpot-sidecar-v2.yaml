# =============================================================================
# penpot-sidecar-v2.yaml — Admin-Sys Agent v3.1 (ex penpot-sidecar)
# Namespace : open-webui
# Mode      : Image autonome — zéro dépendance ConfigMap
#
# Build + deploy :
#   cd /home/neokube-beta
#   docker build -t neokube/penpot-sidecar:latest \
#     -f scripts/Dockerfile.penpot-sidecar scripts/
#   docker save neokube/penpot-sidecar:latest | sudo ctr -n k8s.io images import -
#   kubectl apply -f .kube/manifests/penpot-sidecar-v2.yaml
#   kubectl delete pod -n open-webui -l app=admin-sys-agent --force --grace-period=0
#
# Architecture image :
#   neokube/penpot-sidecar:latest
#   ├── penpot_service.py     ← API principale + LangGraph + HuggingFace/Codestral
#   ├── model_router.py       ← LLM Gateway (Anthropic → Mistral → HF)
#   ├── knowledge_db.py       ← RAG SQLite incidents + manifests
#   ├── self_healing.py       ← Diagnostic auto
#   └── monitor_api.py        ← /v1/monitor/*
#
# Providers LLM : anthropic | mistral | huggingface (Codestral-22B) | ollama
# =============================================================================


# ── §0 · ConfigMap — Base de Connaissance Agent ──────────────────────────────
# L'agent charge cette CM au démarrage + via l'API K8s en live.
# Écrire une nouvelle fix : POST /v1/knowledge {"key": "...", "value": "..."}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-sys-knowledge
  namespace: open-webui
  labels:
    app: admin-sys-agent
    app.kubernetes.io/managed-by: neokube
data:
  penpot_probe: |
    ISSUE: penpot-backend readiness probe retourne 404
    VERSION: Penpot >= 2.0
    FIX: Changer le path de /api/health → /api/rpc/command/get-profile
    PARAMS: initialDelaySeconds=60 failureThreshold=12
    STATUS: confirmed_fix
  penpot_port: |
    ISSUE: penpot-frontend Service inaccessible sur port 80
    VERSION: Penpot 2.14.1 (penpotapp/frontend:latest)
    FIX: nginx écoute sur 8080, PAS 80. containerPort=8080 service.targetPort=8080
    STATUS: confirmed_fix
  traefik_whitelist: |
    ISSUE: 403 Forbidden sur requêtes pod-to-pod ou localhost via Traefik
    FIX: Ajouter 127.0.0.0/8 et 10.42.0.0/16 (Flannel pod CIDR) à ipWhiteList.sourceRange
    STATUS: confirmed_fix
  zombie_pods: |
    ISSUE: Pods bloqués en état Terminating
    CAUSE: K3s runc ne trouve pas log.json dans /run/k3s/containerd/…/log.json
    FIX: kubectl delete pod <name> -n <ns> --force --grace-period=0
    STATUS: known_workaround
  traefik_port_conflict: |
    ISSUE: Traefik CrashLoopBackOff — listen tcp :8080 address already in use
    CAUSE: Processus zombie open-webui sur le host occupent le port
    FIX: HelmChartConfig pour déplacer dashboard vers :9000
    STATUS: confirmed_fix


# ── §1 · PV hostPath pour neokube_state.db ───────────────────────────────────
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neokube-state-pv
  labels:
    app: admin-sys-agent
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /projets/neokube-state
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote


# ── §1 · PVC neokube-state-pvc ───────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neokube-state-pvc
  namespace: open-webui
  labels:
    app: admin-sys-agent
spec:
  storageClassName: ""
  volumeName: neokube-state-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi


# ── §2 · SECRETS ─────────────────────────────────────────────────────────────
# Mettre à jour après apply :
#   kubectl create secret generic penpot-secrets -n open-webui \
#     --from-literal=MISTRAL_API_KEY='...' \
#     --from-literal=HUGGINGFACE_API_KEY='hf_...' \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: penpot-secrets
  namespace: open-webui
  labels:
    app: admin-sys-agent
    version: "3.1"
type: Opaque
stringData:
  MISTRAL_API_KEY: ""
  HUGGINGFACE_API_KEY: ""   # hf_... — Codestral-22B via HuggingFace Inference API


# ── §3 · DEPLOYMENT admin-sys-agent ──────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-sys-agent
  namespace: open-webui
  labels:
    app: admin-sys-agent
    version: "3.1"
    mode: embedded-graph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-sys-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: admin-sys-agent
        version: "3.1"
    spec:
      serviceAccountName: admin-sys-agent

      securityContext:
        runAsUser: 0
        fsGroup: 0

      containers:
        - name: admin-sys-agent
          image: localhost:5000/neokube/penpot-sidecar:latest
          imagePullPolicy: Always
          workingDir: /app/penpot

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            # ── Secrets ──────────────────────────────────────────────────────
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: MISTRAL_API_KEY
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: HUGGINGFACE_API_KEY

            # ── LLM ──────────────────────────────────────────────────────────
            - name: HUGGINGFACE_MODEL
              value: "mistralai/Codestral-22B-v0.1"

            # ── Logging ──────────────────────────────────────────────────────
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: PYTHONUNBUFFERED
              value: "1"

            # ── Contexte SharePoint ──────────────────────────────────────────
            - name: CONTEXT_PATH
              value: "/data/sharepoint/Service-Marketing"

            # ── Persistance ──────────────────────────────────────────────────
            - name: GRAPH_DB_PATH
              value: "/data/neokube_state.db"
            - name: KNOWLEDGE_DB_PATH
              value: "/data/neokube_knowledge.db"

          volumeMounts:
            - name: state
              mountPath: /data
            - name: sharepoint
              mountPath: /data/sharepoint
              readOnly: true
            - name: kube-manifests
              mountPath: /root/.kube/manifests
              readOnly: true
            - name: knowledge
              mountPath: /etc/admin-sys-knowledge
              readOnly: true

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 6
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: neokube-state-pvc
        - name: sharepoint
          hostPath:
            path: /home/neokube-beta/SharePoint
            type: Directory
        - name: kube-manifests
          hostPath:
            path: /home/neokube-beta/.kube/manifests
            type: Directory
        - name: knowledge
          configMap:
            name: admin-sys-knowledge
            optional: true  # pod démarre même si la ConfigMap n'existe pas encore

      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote

      terminationGracePeriodSeconds: 30


# ── §4 · SERVICE admin-sys-agent ─────────────────────────────────────────────
# ClusterIP port 8000 — expose /v1/orchestrate, /health, /docs
# Ingress → api.neokube.local (neokube-ingress.yaml §5)
---
apiVersion: v1
kind: Service
metadata:
  name: admin-sys-agent
  namespace: open-webui
  labels:
    app: admin-sys-agent
    version: "3.1"
spec:
  type: ClusterIP
  selector:
    app: admin-sys-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
