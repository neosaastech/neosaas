---
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: open-webui-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/open-webui-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data-pvc
  namespace: open-webui
spec:
  storageClassName: ""
  volumeName: open-webui-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              hostPort: 3000
              protocol: TCP
          env:
            # ── Ollama ────────────────────────────────────────────────────────
            - name: OLLAMA_BASE_URL
              value: "http://ollama.open-webui.svc.cluster.local:11434"
            # ── Sécurité session (stable → pas de déconnexion au restart) ────
            - name: WEBUI_SECRET_KEY
              value: "neokube-openwebui-secret"
            # ── Admin auto-provisioning (recrée le compte si DB vide) ────────
            - name: WEBUI_ADMIN_EMAIL
              value: "chvandendriessche@neomnia.net"
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: WEBUI_ADMIN_PASSWORD
                  optional: true
            # ── Auth : signup désactivé, login form actif ─────────────────
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: "pending"
            # ── Mistral natif (injecté — ne sera plus jamais redemandé) ──────
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: MISTRAL_API_KEY
            # ── RAG ───────────────────────────────────────────────────────────
            - name: VECTOR_DB
              value: "qdrant"
            - name: QDRANT_HOST
              value: "http://51.159.27.101:6333"
            - name: QDRANT_URI
              value: "http://51.159.27.101:6333"
            # ── Agent local OpenAI-compat (visible comme "LOCAL_ADMIN_AGENT") ─
            - name: OPENAI_API_BASE_URLS
              value: "http://admin-sys-agent.open-webui.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEYS
              value: "local-key"
            - name: OPENAI_API_BASE_URL_NAMES
              value: "LOCAL_ADMIN_AGENT"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
            - name: sharepoint
              mountPath: /data/sharepoint
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data-pvc
        - name: sharepoint
          hostPath:
            path: /home/neokube-beta/SharePoint
            type: Directory
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30300
