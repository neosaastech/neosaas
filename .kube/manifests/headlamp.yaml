# =============================================================================
# headlamp.yaml — Dashboard K8s Headlamp
# Namespace : kube-system
#
# Accès :
#   NodePort  → http://192.168.1.28:30808   (accès direct, sans DNS)
#   Ingress   → http://headlamp.neokube.local  (ajouter dans /etc/hosts)
#
# Deploy :
#   kubectl apply -f .kube/manifests/headlamp.yaml
# =============================================================================


# ── §1 · ServiceAccount ───────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp


# ── §2 · RBAC — lecture complète du cluster ───────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
  labels:
    app: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: kube-system


# ── §3 · Deployment ───────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          imagePullPolicy: IfNotPresent
          args:
            - --in-cluster          # utilise le token du ServiceAccount automatiquement
            - --plugins-dir=/headlamp/plugins
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"


# ── §4 · Service NodePort ─────────────────────────────────────────────────────
# Accès direct sans DNS : http://192.168.1.28:30808
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  type: NodePort
  selector:
    app: headlamp
  ports:
    - name: http
      port: 4466
      targetPort: 4466
      nodePort: 30808
      protocol: TCP


# ── §5 · IngressRoute Traefik ─────────────────────────────────────────────────
# Accès via http://headlamp.neokube.local (ajouter 192.168.1.28 dans /etc/hosts)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headlamp.neokube.local`)
      kind: Rule
      services:
        - name: headlamp
          port: 4466
