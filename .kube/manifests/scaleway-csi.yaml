---
# Secret credentials CSI Scaleway
apiVersion: v1
kind: Secret
metadata:
  name: scaleway-secret
  namespace: kube-system
stringData:
  SCW_ACCESS_KEY: "SCWK4R47320WGS3R5GWA"
  SCW_SECRET_KEY: "39aab20c-720c-466e-9ca0-39fd1cdf7438"
  SCW_DEFAULT_PROJECT_ID: "473a0ce6-ecd8-4374-8f49-9a6e347d0c8d"
  SCW_DEFAULT_REGION: "fr-par"
  SCW_DEFAULT_ZONE: "fr-par-1"
---
# StorageClass scw-bssd (Block SSD standard)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: scw-bssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: csi.scaleway.com
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/fstype: ext4
---
# StorageClass scw-bssd-retain
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: scw-bssd-retain
provisioner: csi.scaleway.com
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/fstype: ext4
---
# ServiceAccount CSI Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaleway-csi-controller
  namespace: kube-system
---
# ServiceAccount CSI Node
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaleway-csi-node
  namespace: kube-system
---
# ClusterRole CSI Controller
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaleway-csi-controller
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments/status]
    verbs: [patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents/status]
    verbs: [update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scaleway-csi-controller
subjects:
  - kind: ServiceAccount
    name: scaleway-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: scaleway-csi-controller
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole CSI Node
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaleway-csi-node
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scaleway-csi-node
subjects:
  - kind: ServiceAccount
    name: scaleway-csi-node
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: scaleway-csi-node
  apiGroup: rbac.authorization.k8s.io
---
# CSI Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaleway-csi-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaleway-csi-controller
  template:
    metadata:
      labels:
        app: scaleway-csi-controller
    spec:
      serviceAccountName: scaleway-csi-controller
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: scaleway-csi-plugin
          image: scaleway/scaleway-csi:v0.3.5
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --v=4
            - --mode=controller
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            - name: SCW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_ACCESS_KEY
            - name: SCW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_SECRET_KEY
            - name: SCW_DEFAULT_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_DEFAULT_PROJECT_ID
            - name: SCW_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_DEFAULT_REGION
            - name: SCW_DEFAULT_ZONE
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_DEFAULT_ZONE
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v4.0.1
          args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --feature-gates=Topology=true
            - --leader-election
            - --default-fstype=ext4
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.5.1
          args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --leader-election
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.10.1
          args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --leader-election
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}
---
# CSI Node DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scaleway-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: scaleway-csi-node
  template:
    metadata:
      labels:
        app: scaleway-csi-node
    spec:
      serviceAccountName: scaleway-csi-node
      hostNetwork: true
      containers:
        - name: scaleway-csi-plugin
          image: scaleway/scaleway-csi:v0.3.5
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --v=4
            - --mode=node
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: SCW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_ACCESS_KEY
            - name: SCW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_SECRET_KEY
            - name: SCW_DEFAULT_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_DEFAULT_PROJECT_ID
            - name: SCW_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_DEFAULT_REGION
            - name: SCW_DEFAULT_ZONE
              valueFrom:
                secretKeyRef:
                  name: scaleway-secret
                  key: SCW_DEFAULT_ZONE
          securityContext:
            privileged: true
            capabilities:
              add: [SYS_ADMIN]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: device-dir
              mountPath: /dev
            - name: sys-dir
              mountPath: /sys
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.1
          args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/csi.scaleway.com/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.scaleway.com
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
        - name: sys-dir
          hostPath:
            path: /sys
---
# CSIDriver resource
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.scaleway.com
spec:
  attachRequired: true
  podInfoOnMount: false
