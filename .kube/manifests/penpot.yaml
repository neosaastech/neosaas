# =============================================================================
# penpot.yaml — Stack Penpot complète (frontend + backend + exporter + postgres + redis)
# Namespace : penpot
#
# Architecture :
#   penpot-frontend (nginx:80)  ← Ingress penpot.neokube.local
#     └─ proxy /api  → penpot-backend:6060
#     └─ proxy /ws   → penpot-backend:6060
#     └─ proxy /export → penpot-exporter:6061
#   penpot-backend  (JVM:6060)  ← PostgreSQL + Redis + assets PVC
#   penpot-exporter (node:6061) ← Redis
#   penpot-postgres (pg15:5432) ← PVC hostPath /var/lib/penpot-postgres
#   penpot-redis    (redis7:6379)
#
# Public URI : http://penpot.neokube.local
# =============================================================================


# ── §1 · PersistentVolumes ────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: penpot-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/penpot-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: penpot-assets-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/penpot-assets
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote


# ── §2 · PersistentVolumeClaims ───────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-postgres-pvc
  namespace: penpot
spec:
  storageClassName: ""
  volumeName: penpot-postgres-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-assets-pvc
  namespace: penpot
spec:
  storageClassName: ""
  volumeName: penpot-assets-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi


# ── §3 · ConfigMap — variables partagées ──────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: penpot-config
  namespace: penpot
data:
  PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-smtp enable-access-tokens"
  PENPOT_PUBLIC_URI: "http://penpot.neokube.local"
  PENPOT_BACKEND_URI: "http://penpot-backend:6060"
  PENPOT_EXPORTER_URI: "http://penpot-exporter:6061"
  PENPOT_REDIS_URI: "redis://penpot-redis/0"
  PENPOT_DATABASE_URI: "postgresql://penpot-postgres/penpot"
  PENPOT_DATABASE_USERNAME: "penpot"
  PENPOT_ASSETS_STORAGE_BACKEND: "assets-fs"
  PENPOT_STORAGE_ASSETS_FS_DIRECTORY: "/opt/data/assets"
  PENPOT_TELEMETRY_ENABLED: "false"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  POSTGRES_DB: "penpot"
  POSTGRES_USER: "penpot"


# ── §4 · Secret — mots de passe ───────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: penpot-secrets
  namespace: penpot
type: Opaque
stringData:
  POSTGRES_PASSWORD: "penpot-db-secret"
  PENPOT_DATABASE_PASSWORD: "penpot-db-secret"
  PENPOT_SECRET_KEY: "neokube-penpot-secret-change-in-prod"


# ── §5 · PostgreSQL ───────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-postgres
  namespace: penpot
  labels:
    app: penpot-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: penpot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PGDATA
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "penpot", "-d", "penpot"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: penpot-postgres-pvc
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-postgres
  namespace: penpot
spec:
  selector:
    app: penpot-postgres
  ports:
    - port: 5432
      targetPort: 5432


# ── §6 · Redis ────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-redis
  namespace: penpot
  labels:
    app: penpot-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: penpot-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-redis
  namespace: penpot
spec:
  selector:
    app: penpot-redis
  ports:
    - port: 6379
      targetPort: 6379


# ── §7 · Penpot Backend ───────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-backend
  namespace: penpot
  labels:
    app: penpot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: penpot-backend
    spec:
      containers:
        - name: penpot-backend
          image: penpotapp/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6060
          env:
            - name: PENPOT_FLAGS
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_FLAGS
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: PENPOT_SECRET_KEY
            - name: PENPOT_PUBLIC_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_PUBLIC_URI
            - name: PENPOT_DATABASE_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_DATABASE_URI
            - name: PENPOT_DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_DATABASE_USERNAME
            - name: PENPOT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: PENPOT_DATABASE_PASSWORD
            - name: PENPOT_REDIS_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_REDIS_URI
            - name: PENPOT_ASSETS_STORAGE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_ASSETS_STORAGE_BACKEND
            - name: PENPOT_STORAGE_ASSETS_FS_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_STORAGE_ASSETS_FS_DIRECTORY
            - name: PENPOT_TELEMETRY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_TELEMETRY_ENABLED
            - name: PENPOT_EXPORTER_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_EXPORTER_URI
          volumeMounts:
            - name: assets
              mountPath: /opt/data/assets
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /api/rpc/command/get-profile
              port: 6060
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/rpc/command/get-profile
              port: 6060
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: penpot-assets-pvc
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-backend
  namespace: penpot
spec:
  selector:
    app: penpot-backend
  ports:
    - port: 6060
      targetPort: 6060


# ── §8 · Penpot Exporter ──────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-exporter
  namespace: penpot
  labels:
    app: penpot-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-exporter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: penpot-exporter
    spec:
      containers:
        - name: penpot-exporter
          image: penpotapp/exporter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6061
          env:
            - name: PENPOT_PUBLIC_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_PUBLIC_URI
            - name: PENPOT_REDIS_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_REDIS_URI
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-exporter
  namespace: penpot
spec:
  selector:
    app: penpot-exporter
  ports:
    - port: 6061
      targetPort: 6061


# ── §9 · Penpot Frontend ─────────────────────────────────────────────────────
# nginx — proxy /api et /ws vers penpot-backend, /export vers penpot-exporter
# Ciblé par l'Ingress penpot.neokube.local (neokube-ingress.yaml §4)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-frontend
  namespace: penpot
  labels:
    app: penpot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: penpot-frontend
    spec:
      containers:
        - name: penpot-frontend
          image: penpotapp/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PENPOT_FLAGS
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_FLAGS
            - name: PENPOT_BACKEND_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_BACKEND_URI
            - name: PENPOT_EXPORTER_URI
              valueFrom:
                configMapKeyRef:
                  name: penpot-config
                  key: PENPOT_EXPORTER_URI
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-frontend
  namespace: penpot
  labels:
    app: penpot-frontend
spec:
  selector:
    app: penpot-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
