# ============================================================
# Patch : ajoute TEMPORAL_HOST au container penpot-agent
# Sans toucher au reste du déploiement open-webui (merge stratégique).
#
# Appliquer avec :
#   kubectl patch deployment open-webui -n open-webui \
#     --patch-file penpot-sidecar-temporal-patch.yaml
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  template:
    spec:
      containers:
        - name: penpot-agent
          env:
            # ── Liaison Temporal (Service ExternalName dans open-webui) ────
            - name: TEMPORAL_HOST
              value: "temporal-server:7233"
