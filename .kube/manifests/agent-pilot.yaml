---
# ── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: agent-system
---
# ── ServiceAccount ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-pilot-sa
  namespace: agent-system
---
# ── ClusterRole — permissions API Kubernetes ─────────────────────────────────
# Lecture large + écriture ciblée sur Deployments/Pods/ConfigMaps
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-pilot-role
rules:
  # Lecture de l'état du cluster
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces", "nodes",
                "configmaps", "events", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Gestion des Deployments / StatefulSets / DaemonSets
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Redémarrage / exécution de pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "create"]
  # Gestion des ConfigMaps (pour stocker l'état de l'agent)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Jobs pour tâches ponctuelles lancées par l'agent
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# ── ClusterRoleBinding ───────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-pilot-binding
subjects:
  - kind: ServiceAccount
    name: agent-pilot-sa
    namespace: agent-system
roleRef:
  kind: ClusterRole
  name: agent-pilot-role
  apiGroup: rbac.authorization.k8s.io
---
# ── PersistentVolume — SSD NVMe /projets ─────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: projets-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /projets
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote
---
# ── PersistentVolumeClaim ────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: projets-pvc
  namespace: agent-system
spec:
  storageClassName: ""
  volumeName: projets-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
# ── ConfigMap — configuration de l'agent ─────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-pilot-config
  namespace: agent-system
data:
  HF_MODEL_ID: "mistralai/Mistral-7B-Instruct-v0.3"
  POLL_INTERVAL_SECONDS: "10"
  LOG_LEVEL: "INFO"
  PROJETS_DIR: "/projets"
  KUBE_NAMESPACE_FILTER: ""   # vide = tous les namespaces
---
# ── Secret — token HuggingFace (à remplir avant apply) ───────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: agent-pilot-secrets
  namespace: agent-system
type: Opaque
stringData:
  HF_TOKEN: "REMPLACER_PAR_TON_TOKEN_HF"   # hf_xxxxxxxxxxxxxxxxxxxx
---
# ── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pilot
  namespace: agent-system
  labels:
    app: agent-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-pilot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: agent-pilot
    spec:
      serviceAccountName: agent-pilot-sa
      containers:
        - name: agent-pilot
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/bridge.py"]
          envFrom:
            - configMapRef:
                name: agent-pilot-config
            - secretRef:
                name: agent-pilot-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
            - name: projets
              mountPath: /projets
            - name: agent-state
              mountPath: /var/agent-state
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; open('/var/agent-state/.alive')"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      initContainers:
        - name: install-deps
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --quiet --no-cache-dir \
                huggingface_hub \
                kubernetes \
                requests \
                && echo "deps OK" > /var/agent-state/.deps
          volumeMounts:
            - name: agent-state
              mountPath: /var/agent-state
      volumes:
        - name: app-code
          hostPath:
            path: /home/neokube-beta/scripts
            type: Directory
        - name: projets
          persistentVolumeClaim:
            claimName: projets-pvc
        - name: agent-state
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
