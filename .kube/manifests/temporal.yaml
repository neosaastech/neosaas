---
# Temporal Dev Server (SQLite) — léger, pour test/développement
# Image officielle : temporalio/temporal avec commande "server start-dev"
# DNS interne : temporal.agent-system.svc.cluster.local:7233
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: agent-system
  labels:
    app: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: temporal
    spec:
      securityContext:
        runAsUser: 0        # root requis pour écrire dans /projets/temporal (root:root)
        fsGroup: 0
      containers:
        - name: temporal
          image: temporalio/temporal:latest
          imagePullPolicy: IfNotPresent
          command:
            - temporal
            - server
            - start-dev
            - --db-filename=/temporal-data/temporal.db
            - --ip=0.0.0.0
            - --port=7233
            - --http-port=7243
            - --ui-port=8233
            - --namespace=default
            - --namespace=agent-system
            - --log-level=warn
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
            - name: http
              containerPort: 7243
              protocol: TCP
            - name: ui
              containerPort: 8233
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: temporal-data
              mountPath: /temporal-data
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: temporal-data
          persistentVolumeClaim:
            claimName: agent-temporal-pvc
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: agent-system
spec:
  type: ClusterIP
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: http
      port: 7243
      targetPort: 7243
---
# UI Temporal accessible depuis le navigateur
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: agent-system
spec:
  type: NodePort
  selector:
    app: temporal
  ports:
    - name: ui
      port: 8233
      targetPort: 8233
      nodePort: 32233
