---
# Namespace RAG sur Kapsule
apiVersion: v1
kind: Namespace
metadata:
  name: rag-system
  labels:
    app.kubernetes.io/part-of: neokube-rag

---
# StorageClass scw-bssd (disponible nativement sur Kapsule)
# Déjà présente sur Kapsule — déclarée ici pour référence
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: scw-bssd
# provisioner: csi.scaleway.com
# reclaimPolicy: Retain
# allowVolumeExpansion: true

---
# PersistentVolumeClaim Qdrant — Block SSD 20Gi (extensible)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: rag-system
  labels:
    app: qdrant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scw-bssd
  resources:
    requests:
      storage: 20Gi

---
# ConfigMap Qdrant
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-config
  namespace: rag-system
data:
  production.yaml: |
    log_level: INFO
    storage:
      storage_path: /qdrant/storage
      snapshots_path: /qdrant/snapshots
    service:
      host: 0.0.0.0
      http_port: 6333
      grpc_port: 6334
    cluster:
      enabled: false
    telemetry_disabled: true

---
# Deployment Qdrant
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: rag-system
  labels:
    app: qdrant
    version: "1.9"
spec:
  replicas: 1
  strategy:
    type: Recreate          # block volume = RWO, pas de rolling update
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        version: "1.9"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.17.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-secret
                  key: api-key
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
            - name: qdrant-config
              mountPath: /qdrant/config/production.yaml
              subPath: production.yaml
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 6333
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-data
        - name: qdrant-config
          configMap:
            name: qdrant-config

---
# Service ClusterIP (accès interne)
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag-system
  labels:
    app: qdrant
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  type: ClusterIP

---
# Service LoadBalancer (accès depuis kubinote local)
apiVersion: v1
kind: Service
metadata:
  name: qdrant-lb
  namespace: rag-system
  labels:
    app: qdrant
  annotations:
    service.beta.kubernetes.io/scw-loadbalancer-zone: fr-par-1
    service.beta.kubernetes.io/scw-loadbalancer-type: LB-S
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  type: LoadBalancer
