# =============================================================================
# agent-ops.yaml — Infrastructure des Agents Autonomes NeoKube
# Architecture 32 Go — Mode autonome, zéro bidouillage manuel
#
# Agents déployés :
#   admin-sys       → Guardian de la stack Penpot (actif)
#
# Slots préparés (futurs) :
#   graphical-agent → Sidecar visuel Penpot
#   seo-leads-agent → Agent métier SEO/Leads
#
# RBAC : ClusterRole admin-sys-role (read/patch deployments, services, ingresses)
# Namespace : agent-ops
# =============================================================================


# ── §1 · Namespace agent-ops ──────────────────────────────────────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-ops
  labels:
    app.kubernetes.io/managed-by: neokube
    purpose: autonomous-agents
    architecture: 32g


# ── §2 · RBAC — admin-sys ─────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sys
  namespace: agent-ops
  labels:
    app: admin-sys
    role: guardian
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-sys-role
  labels:
    app.kubernetes.io/managed-by: neokube
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-sys-binding
  labels:
    app.kubernetes.io/managed-by: neokube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-sys-role
subjects:
  - kind: ServiceAccount
    name: admin-sys
    namespace: agent-ops
  - kind: ServiceAccount
    name: admin-sys-agent
    namespace: open-webui


# ── §3 · RBAC — graphical-agent (slot préparé) ───────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphical-agent
  namespace: agent-ops
  labels:
    app: graphical-agent
    role: visual-sidecar
    status: prepared
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: graphical-agent-role
  namespace: penpot
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: graphical-agent-binding
  namespace: penpot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: graphical-agent-role
subjects:
  - kind: ServiceAccount
    name: graphical-agent
    namespace: agent-ops


# ── §4 · RBAC — seo-leads-agent (slot préparé) ───────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seo-leads-agent
  namespace: agent-ops
  labels:
    app: seo-leads-agent
    role: business-intelligence
    status: prepared
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seo-leads-agent-role
  namespace: agent-ops
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seo-leads-agent-binding
  namespace: agent-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seo-leads-agent-role
subjects:
  - kind: ServiceAccount
    name: seo-leads-agent
    namespace: agent-ops


# ── §5 · ServiceAccount — admin-sys-agent (namespace open-webui) ─────────────
# Le pod admin-sys-agent tourne dans open-webui. Ce SA lui donne accès à l'API K8s.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sys-agent
  namespace: open-webui
  labels:
    app: admin-sys-agent
    role: k8s-api-access
    app.kubernetes.io/managed-by: neokube


# ── §5b · Role — exec dans penpot (pour penpot-postgres) ──────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-sys-agent-exec
  namespace: penpot
  labels:
    app.kubernetes.io/managed-by: neokube
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-sys-agent-exec-binding
  namespace: penpot
  labels:
    app.kubernetes.io/managed-by: neokube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-sys-agent-exec
subjects:
  - kind: ServiceAccount
    name: admin-sys-agent
    namespace: open-webui


# ── §5c · Role — patch secrets dans open-webui (mise à jour PENPOT_TOKEN) ────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-sys-agent-secrets
  namespace: open-webui
  labels:
    app.kubernetes.io/managed-by: neokube
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-sys-agent-secrets-binding
  namespace: open-webui
  labels:
    app.kubernetes.io/managed-by: neokube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-sys-agent-secrets
subjects:
  - kind: ServiceAccount
    name: admin-sys-agent
    namespace: open-webui


# ── §6 · ConfigMap — script agent admin-sys ──────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-sys-script
  namespace: agent-ops
  labels:
    app: admin-sys
data:
  agent.py: |
    #!/usr/bin/env python3
    """
    Admin-Sys Agent v1.0 — Guardian autonome de la stack Penpot
    Architecture : NeoKube 32Go — zéro intervention manuelle
    """
    import os, time, logging, requests
    from kubernetes import client, config
    from kubernetes.client.rest import ApiException

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [ADMIN-SYS] %(levelname)s %(message)s",
        datefmt="%Y-%m-%d %H:%M:%S",
    )
    log = logging.getLogger("admin-sys")

    NS           = "penpot"
    BACKEND_SVC  = "http://penpot-backend.penpot.svc.cluster.local:6060"
    FRONTEND_SVC = "http://penpot-frontend.penpot.svc.cluster.local:80"
    HEALTH_PATH  = "/api/rpc/command/get-profile"
    INTERVAL     = int(os.getenv("CHECK_INTERVAL", "30"))
    confirmed    = False


    def k8s_clients():
        try:
            config.load_incluster_config()
        except Exception:
            config.load_kube_config()
        return client.AppsV1Api(), client.CoreV1Api(), client.NetworkingV1Api()


    def http_ok(url, timeout=5):
        try:
            r = requests.get(url, timeout=timeout)
            return r.status_code < 500
        except Exception:
            return False


    def deployment_ready(apps_v1, name):
        try:
            d = apps_v1.read_namespaced_deployment(name, NS)
            ready   = d.status.ready_replicas or 0
            desired = d.spec.replicas or 1
            return ready, desired
        except ApiException:
            return 0, 0


    def fix_backend_probe(apps_v1):
        """Corrige le probe readiness si le path est /api/health (Penpot <2.x)."""
        try:
            dep = apps_v1.read_namespaced_deployment("penpot-backend", NS)
            for c in dep.spec.template.spec.containers:
                if c.name != "penpot-backend":
                    continue
                rp = c.readiness_probe
                lp = c.liveness_probe
                changed = False
                if rp and rp.http_get and rp.http_get.path != HEALTH_PATH:
                    log.info(f"Fix readinessProbe: {rp.http_get.path} → {HEALTH_PATH}")
                    rp.http_get.path    = HEALTH_PATH
                    rp.failure_threshold = 12
                    rp.initial_delay_seconds = 60
                    changed = True
                if lp and lp.http_get and lp.http_get.path != HEALTH_PATH:
                    log.info(f"Fix livenessProbe: {lp.http_get.path} → {HEALTH_PATH}")
                    lp.http_get.path    = HEALTH_PATH
                    lp.failure_threshold = 5
                    changed = True
                if changed:
                    apps_v1.patch_namespaced_deployment("penpot-backend", NS, dep)
                    log.info("penpot-backend deployment patched")
        except ApiException as e:
            log.error(f"patch failed: {e}")


    def fix_ingress(net_v1):
        """Vérifie que penpot-frontend Ingress → Service port 80."""
        try:
            ing = net_v1.read_namespaced_ingress("penpot-frontend", NS)
            for rule in (ing.spec.rules or []):
                if rule.host != "penpot.neokube.local":
                    continue
                for path in (rule.http.paths or []):
                    p = path.backend.service.port.number
                    if p != 80:
                        log.warning(f"Ingress port {p} → fixing to 80")
                        path.backend.service.port.number = 80
                        net_v1.patch_namespaced_ingress("penpot-frontend", NS, ing)
                        log.info("Ingress patched → port 80")
        except ApiException as e:
            log.error(f"ingress check: {e}")


    def scan(apps_v1, core_v1, net_v1):
        global confirmed
        log.info("── SCAN ─────────────────────────────────────")

        fix_backend_probe(apps_v1)
        fix_ingress(net_v1)

        b_ready, b_total = deployment_ready(apps_v1, "penpot-backend")
        f_ready, f_total = deployment_ready(apps_v1, "penpot-frontend")
        backend_http     = http_ok(BACKEND_SVC + HEALTH_PATH)
        frontend_http    = http_ok(FRONTEND_SVC)

        log.info(f"penpot-backend  : {b_ready}/{b_total} ready | HTTP {'✓' if backend_http else '✗'}")
        log.info(f"penpot-frontend : {f_ready}/{f_total} ready | HTTP {'✓' if frontend_http else '✗'}")

        all_ok = frontend_http and f_ready == f_total
        if all_ok and not confirmed:
            confirmed = True
            log.info("════════════════════════════════════════════════════")
            log.info("✅ Accès Penpot rétabli sur http://penpot.neokube.local")
            log.info("════════════════════════════════════════════════════")
        elif not all_ok:
            log.info("⏳ Stack not fully ready — retry in %ds", INTERVAL)


    def main():
        log.info("Admin-Sys Agent démarré — architecture 32Go")
        log.info("Slots futurs : graphical-agent | seo-leads-agent")
        apps_v1, core_v1, net_v1 = k8s_clients()
        log.info("Kubernetes client initialisé")
        while True:
            try:
                scan(apps_v1, core_v1, net_v1)
            except Exception as e:
                log.error(f"Scan exception: {e}")
            time.sleep(INTERVAL)


    if __name__ == "__main__":
        main()


# ── §7 · Deployment — admin-sys ───────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-sys
  namespace: agent-ops
  labels:
    app: admin-sys
    role: guardian
    part-of: neokube-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-sys
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: admin-sys
        role: guardian
    spec:
      serviceAccountName: admin-sys
      containers:
        - name: admin-sys
          image: python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install -q kubernetes requests 2>&1 | tail -1 && \
              echo "[ADMIN-SYS] Dépendances OK" && \
              python /scripts/agent.py
          env:
            - name: CHECK_INTERVAL
              value: "30"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
      volumes:
        - name: scripts
          configMap:
            name: admin-sys-script
            defaultMode: 0755
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: kubinote
      terminationGracePeriodSeconds: 10
