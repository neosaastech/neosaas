---
# ── PV MongoDB — /projets/mongodb sur SSD NVMe ───────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agent-mongodb-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /projets/mongodb
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-mongodb-pvc
  namespace: agent-system
spec:
  storageClassName: ""
  volumeName: agent-mongodb-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
