# =============================================================================
# cockpit.yaml — Cockpit de monitoring & Hub API
# Namespace : cockpit
#
# Stack :
#   langfuse-postgres  → PostgreSQL 15 dédié Langfuse (256Mi)
#   langfuse           → Observabilité LLM v2 (512Mi) — langfuse.neokube.local
#   litellm            → Hub API / proxy LLM (256Mi) — litellm.neokube.local
#
# Temporal UI est dans agent-system (temporal.neokube.local)
#
# Apply :
#   kubectl apply -f .kube/manifests/cockpit.yaml
#   kubectl apply -f .kube/manifests/neokube-ingress.yaml  # si ingress manquants
# =============================================================================


# ── §0 · Namespace ────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: cockpit
  labels:
    app.kubernetes.io/managed-by: neokube
    purpose: observability


# ── §1 · Secrets ─────────────────────────────────────────────────────────────
# Modifier AVANT apply :
#   LANGFUSE_SECRET    → openssl rand -hex 32
#   LANGFUSE_SALT      → openssl rand -hex 16
#   LITELLM_MASTER_KEY → clé à utiliser dans Open WebUI / agents
#   LANGFUSE_PG_PASS   → mot de passe postgres langfuse
---
apiVersion: v1
kind: Secret
metadata:
  name: cockpit-secrets
  namespace: cockpit
  labels:
    app.kubernetes.io/managed-by: neokube
type: Opaque
stringData:
  LANGFUSE_SECRET: "neokube-langfuse-secret-changeme"
  LANGFUSE_SALT: "neokube-langfuse-salt-16c"
  LITELLM_MASTER_KEY: "sk-neokube-litellm-master"
  LANGFUSE_PG_PASS: "langfuse_pg_pass_neokube"
  MISTRAL_API_KEY: ""   # injecté depuis penpot-secrets si besoin


# ── §2 · PV + PVC Langfuse PostgreSQL ────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: langfuse-postgres-pv
  labels:
    app: langfuse-postgres
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/langfuse-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kubinote
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres-pvc
  namespace: cockpit
  labels:
    app: langfuse-postgres
spec:
  storageClassName: ""
  volumeName: langfuse-postgres-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi


# ── §3 · PostgreSQL pour Langfuse ─────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  namespace: cockpit
  labels:
    app: langfuse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: "langfuse"
            - name: POSTGRES_USER
              value: "langfuse"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cockpit-secrets
                  key: LANGFUSE_PG_PASS
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: langfuse-postgres-pvc
      nodeSelector:
        kubernetes.io/hostname: kubinote
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: cockpit
spec:
  selector:
    app: langfuse-postgres
  ports:
    - port: 5432
      targetPort: 5432


# ── §4 · Langfuse v2 — Observabilité LLM ─────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: cockpit
  labels:
    app: langfuse
    version: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langfuse
        version: "2"
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://langfuse:$(LANGFUSE_PG_PASS)@langfuse-postgres.cockpit.svc.cluster.local:5432/langfuse"
            - name: LANGFUSE_PG_PASS
              valueFrom:
                secretKeyRef:
                  name: cockpit-secrets
                  key: LANGFUSE_PG_PASS
            - name: NEXTAUTH_URL
              value: "http://langfuse.neokube.local"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cockpit-secrets
                  key: LANGFUSE_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: cockpit-secrets
                  key: LANGFUSE_SALT
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      nodeSelector:
        kubernetes.io/hostname: kubinote
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: cockpit
  labels:
    app: langfuse
spec:
  selector:
    app: langfuse
  ports:
    - name: http
      port: 3000
      targetPort: 3000


# ── §5 · LiteLLM — Hub API / Proxy LLM ───────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: cockpit
  labels:
    app: litellm
data:
  config.yaml: |
    model_list:
      - model_name: mistral
        litellm_params:
          model: mistral/codestral-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: admin-sys-agent
        litellm_params:
          model: openai/admin-sys-agent
          api_base: http://admin-sys-agent.open-webui.svc.cluster.local:8000/v1
          api_key: local-key

    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
      langfuse_secret_key: os.environ/LANGFUSE_SECRET_KEY
      langfuse_host: http://langfuse.cockpit.svc.cluster.local:3000

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: ""   # SQLite par défaut
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: cockpit
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cockpit-secrets
                  key: LITELLM_MASTER_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: MISTRAL_API_KEY
                  # namespace: open-webui → cross-ns non supporté directement
                  # Solution : dupliquer la clé dans cockpit-secrets ou utiliser External Secrets
            - name: LANGFUSE_PUBLIC_KEY
              value: ""   # À renseigner après création du projet dans Langfuse UI
            - name: LANGFUSE_SECRET_KEY
              value: ""   # idem
            - name: STORE_MODEL_IN_DB
              value: "True"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
      nodeSelector:
        kubernetes.io/hostname: kubinote
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: cockpit
  labels:
    app: litellm
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
