---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neokube-sre-agent
  namespace: open-webui
  labels:
    app: neokube-sre-agent
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neokube-sre-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: neokube-sre-agent
        version: "1.0"
    spec:
      serviceAccountName: admin-sys-agent  # réutilise le SA avec accès K8s
      nodeSelector:
        kubernetes.io/hostname: kubinote
        kubernetes.io/os: linux
      containers:
        - name: neokube-sre-agent
          image: docker.io/neokube/neokube-sre-agent:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm.cockpit.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY
            - name: SCW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-s3-creds
                  key: SCW_SECRET_KEY
            - name: SCW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-s3-creds
                  key: SCW_ACCESS_KEY
            - name: SCW_DEFAULT_PROJECT_ID
              value: "473a0ce6-ecd8-4374-8f49-9a6e347d0c8d"
            - name: SCW_DEFAULT_REGION
              value: "fr-par"
            - name: SCW_DEFAULT_ZONE
              value: "fr-par-1"
            - name: AGENT_API_KEY
              value: "sre-local-key"
            - name: LOG_LEVEL
              value: "INFO"
            - name: SRE_MODEL
              value: "mistral"
            - name: GIT_HOME
              value: "/workspace"
            - name: GIT_AUTHOR_NAME
              value: "NeoKube-SRE"
            - name: GIT_AUTHOR_EMAIL
              value: "sre@neomnia.net"
            - name: GIT_COMMITTER_NAME
              value: "NeoKube-SRE"
            - name: GIT_COMMITTER_EMAIL
              value: "sre@neomnia.net"
            - name: GIT_SSH_COMMAND
              value: "ssh -i /workspace/.ssh/id_ed25519_neokube -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            # HOME ne doit PAS pointer vers /workspace — sinon kubectl charge le
            # kubeconfig du host (current-context=Kapsule) au lieu de l'in-cluster SA.
            # GIT_SSH_COMMAND + GIT_HOME suffisent pour git, sans toucher HOME.
            - name: KUBECONFIG
              value: ""
          command:
            - bash
            - -c
            - |
              git config --global --add safe.directory /workspace
              git config --global user.name "NeoKube-SRE"
              git config --global user.email "sre@neomnia.net"
              exec python3 -m uvicorn neokube_sre_service:app --host 0.0.0.0 --port 8001 --workers 1
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: workspace
          hostPath:
            path: /home/neokube-beta
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: neokube-sre-agent
  namespace: open-webui
  labels:
    app: neokube-sre-agent
spec:
  selector:
    app: neokube-sre-agent
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  type: ClusterIP
