---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neokube-sre-agent
  namespace: open-webui
  labels:
    app: neokube-sre-agent
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neokube-sre-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: neokube-sre-agent
        version: "1.0"
    spec:
      serviceAccountName: admin-sys-agent  # réutilise le SA avec accès K8s
      nodeSelector:
        kubernetes.io/hostname: kubinote
        kubernetes.io/os: linux
      containers:
        - name: neokube-sre-agent
          image: neokube/neokube-sre-agent:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm.cockpit.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY
            - name: SCW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-s3-creds
                  key: SCW_SECRET_KEY
            - name: SCW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-s3-creds
                  key: SCW_ACCESS_KEY
            - name: SCW_DEFAULT_PROJECT_ID
              value: "473a0ce6-ecd8-4374-8f49-9a6e347d0c8d"
            - name: SCW_DEFAULT_REGION
              value: "fr-par"
            - name: SCW_DEFAULT_ZONE
              value: "fr-par-1"
            - name: AGENT_API_KEY
              value: "sre-local-key"
            - name: LOG_LEVEL
              value: "INFO"
            - name: SRE_MODEL
              value: "mistral"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: neokube-sre-agent
  namespace: open-webui
  labels:
    app: neokube-sre-agent
spec:
  selector:
    app: neokube-sre-agent
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  type: ClusterIP
