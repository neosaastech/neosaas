# ============================================================
# NeoKube Orchestration — Service Mesh Unifié
# Namespace principal : agent-system
# Bridges cross-namespace vers : open-webui
# Appliqué avec : kubectl apply -f neokube-orchestration.yaml
# ============================================================
#
# DÉPENDANCES EXISTANTES (ne pas ré-appliquer séparément) :
#   Temporal deployment + Services  → temporal.yaml
#   PV/PVC agent-temporal-pvc       → agent-system-storage.yaml
#   Penpot sidecar v2.0             → penpot-sidecar-patch.yaml
#
# TOPOLOGIE DES LIAISONS :
#   penpot-agent (open-webui)
#     └─ Service penpot-agent:8000         [open-webui]
#          └─ ExternalName penpot-sidecar  [agent-system]
#               └─ PENPOT_SIDECAR_URL dans langgraph-api ✓
#
#   temporal (agent-system)
#     └─ Service temporal-server:7233      [agent-system]
#          └─ ExternalName temporal-server [open-webui]
#               └─ TEMPORAL_HOST dans penpot-sidecar ✓
# ============================================================


# ── §1 · SERVICE ALIAS : temporal-server (agent-system) ──────────────────────
# Alias explicite du Service "temporal" existant.
# Permet aux pods in-namespace (dont langgraph-api) d'utiliser :
#   TEMPORAL_HOST="temporal-server:7233"
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-server
  namespace: agent-system
  labels:
    part-of: neokube-orchestration
spec:
  type: ClusterIP
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: http
      port: 7243
      targetPort: 7243


# ── §2 · SERVICE BRIDGE : temporal-server (open-webui → agent-system) ─────────
# ExternalName dans le namespace open-webui.
# Permet au container penpot-agent d'utiliser le nom court :
#   TEMPORAL_HOST="temporal-server:7233"
# sans FQDN cross-namespace.
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-server
  namespace: open-webui
  labels:
    part-of: neokube-orchestration
spec:
  type: ExternalName
  externalName: temporal-server.agent-system.svc.cluster.local



# ── §4 · SERVICE BRIDGE : penpot-sidecar (agent-system → open-webui) ──────────
# ExternalName dans agent-system.
# Permet à langgraph-api d'utiliser le nom court :
#   PENPOT_SIDECAR_URL="http://penpot-sidecar:8000"
# Pointe vers le Deployment standalone défini dans penpot-sidecar-v2.yaml.
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-sidecar
  namespace: agent-system
  labels:
    part-of: neokube-orchestration
spec:
  type: ExternalName
  externalName: penpot-sidecar.open-webui.svc.cluster.local


# ── §5 · NOTE : LANGGRAPH EMBEDDED ───────────────────────────────────────────
# LangGraph tourne désormais en mode "Embedded Graph" dans penpot-sidecar.
# → Plus besoin de LangGraph Server, PostgreSQL dédié, Redis, ou licence.
# → Graphe compilé au démarrage du pod : designer → seo_check → END
# → Persistance : SqliteSaver (fichier /tmp/penpot-graph.db dans le pod)
#   Configurable via env var GRAPH_DB_PATH dans penpot-sidecar-v2.yaml.
# → Voir : scripts/penpot_service.py (node_designer, node_seo_check, penpot_graph)


# ── §6 · INGRESS — temporal-ui ────────────────────────────────────────────────
# Accès navigateur via Ingress Controller NGINX :
#   http://temporal.neokube.local  (ajouter dans /etc/hosts → <NODE_IP>)
# NodePort direct toujours actif sur :32233 (temporal.yaml).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui-ingress
  namespace: agent-system
  labels:
    part-of: neokube-orchestration
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: temporal.neokube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: 8233
