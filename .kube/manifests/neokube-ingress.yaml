# =============================================================================
# neokube-ingress.yaml — Routage Traefik + Sécurité IP
# Namespace source : kube-system (Middleware), chaque service dans son NS
#
# Hosts exposés :
#   http://headlamp.neokube.local   → kube-system/headlamp:4466
#   http://temporal.neokube.local   → agent-system/temporal-ui:8233
#   http://penpot.neokube.local     → penpot/penpot-frontend:80
#   http://api.neokube.local        → open-webui/admin-sys-agent:8000
#   http://langfuse.neokube.local   → cockpit/langfuse:3000    ← observabilité LLM
#   http://litellm.neokube.local    → cockpit/litellm:4000     ← hub API
#
# Whitelist : 192.168.1.0/24 + 127.0.0.0/8 (localhost) + 10.42.0.0/16 (pod CIDR K3s)
# =============================================================================


# ── §1 · Middleware IP Whitelist ──────────────────────────────────────────────
# Traefik CRD Middleware — appliqué via annotation sur chaque Ingress :
#   traefik.ingress.kubernetes.io/router.middlewares: kube-system-local-ip-whitelist@kubernetescrd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-ip-whitelist
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: neokube
spec:
  ipWhiteList:
    sourceRange:
      - 192.168.1.0/24
      - 127.0.0.0/8
      - 10.42.0.0/16


# ── §2 · Ingress — Headlamp ───────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-local-ip-whitelist@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.neokube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 4466


# ── §3 · Ingress — Temporal UI ────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui
  namespace: agent-system
  labels:
    app: temporal
    part-of: neokube-orchestration
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-local-ip-whitelist@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: temporal.neokube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: 8233


# ── §4 · Ingress — Penpot App (frontend design) ──────────────────────────────
# Service cible : penpot/penpot-frontend:80
# STATUT : penpot-frontend non encore déployé → 503 jusqu'au déploiement de Penpot.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: penpot-frontend
  namespace: penpot
  labels:
    app: penpot
    component: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-local-ip-whitelist@kubernetescrd"
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
    - host: penpot.neokube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: penpot-frontend
                port:
                  number: 80


# ── §5 · Ingress — Admin-Sys Agent (ex penpot-sidecar) ───────────────────────
# Service cible : open-webui/admin-sys-agent:8000
# Endpoints : /v1/orchestrate, /v1/monitor/*, /health, /docs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-sys-agent
  namespace: open-webui
  labels:
    app: admin-sys-agent
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-local-ip-whitelist@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: api.neokube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-sys-agent
                port:
                  number: 8000


