name: lint-layers

on:
  pull_request:
    paths:
      - "lib/layers/**"
      - "components/layers/**"
  push:
    branches: [main, release/2.0.0]
    paths:
      - "lib/layers/**"
      - "components/layers/**"

jobs:
  lint-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:layers
